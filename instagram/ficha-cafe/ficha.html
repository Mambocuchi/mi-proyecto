<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ficha técnica café Carlos Roldi</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
@page { size: 1080px 1350px; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1350px; font-family: 'Montserrat', sans-serif; color: #000; }
.post { width: 1080px; height: 1350px; background: #EDD7BF; position: relative; overflow: hidden; padding: 0 80px; }
h1 { position: absolute; top: 200px; left: 0; right: 0; text-align: center; font-weight: 900; font-size: 64px; letter-spacing: .02em; color: #000; }
.tabla { position: absolute; top: 330px; left: 60px; right: 60px; border-top: 2px solid rgba(0,0,0,.55); }
.fila { display: grid; grid-template-columns: 56px 350px 1fr; align-items: center; min-height: 110px; border-bottom: 2px solid rgba(0,0,0,.55); padding: 0 14px; column-gap: 22px; }
.fila svg { width: 52px; height: 52px; fill: none; stroke: #243D5B; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.fila b { font-weight: 700; font-size: 31px; line-height: 1.12; }
.fila span { font-weight: 500; font-size: 30px; line-height: 1.2; }
.pie { position: absolute; bottom: 70px; left: 0; right: 0; display: flex; justify-content: center; }
.pie img { height: 84px; }
</style>
</head>
<body>
<section class="post">
  <h1>CARLOS ROLDI</h1>
  <div class="tabla">
    <div class="fila">
      <svg viewBox="0 0 48 48"><path d="M30 8l10 10L18 40H8V30z"/><path d="M26 12l10 10"/><path d="M6 44h36"/></svg>
      <b>Nombre comercial</b><span>Carlos Roldi</span>
    </div>
    <div class="fila">
      <svg viewBox="0 0 48 48"><ellipse cx="17" cy="20" rx="9" ry="12" transform="rotate(-30 17 20)"/><path d="M12 28c3-6 7-10 10-17"/><ellipse cx="31" cy="20" rx="9" ry="12" transform="rotate(30 31 20)"/><path d="M36 28c-3-6-7-10-10-17"/><path d="M10 34c4 6 10 8 14 8s10-2 14-8"/><path d="M24 30v12"/></svg>
      <b>Especie</b><span>Canephora</span>
    </div>
    <div class="fila">
      <svg viewBox="0 0 48 48"><rect x="6" y="6" width="22" height="22" rx="4"/><path d="M28 20h10a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4V28"/></svg>
      <b>Variedad(es)</b><span>Conilon</span>
    </div>
    <div class="fila">
      <svg viewBox="0 0 48 48"><path d="M4 30l9-10 7 6 9-12"/><path d="M38 6v34"/><path d="M33 11l5-5 5 5"/><path d="M33 35l5 5 5-5"/><path d="M4 42h28"/></svg>
      <b>Altitud (msnm)</b><span>500</span>
    </div>
    <div class="fila">
      <svg viewBox="0 0 48 48"><path d="M6 22L24 7l18 15"/><path d="M10 19v23h28V19"/><path d="M20 42V30h8v12"/></svg>
      <b>Finca / Origen</b><span>Caldeirão de São José</span>
    </div>
    <div class="fila">
      <svg viewBox="0 0 48 48"><path d="M24 44s14-13 14-25a14 14 0 0 0-28 0c0 12 14 25 14 25z"/><circle cx="24" cy="19" r="5"/></svg>
      <b>Región / País</b><span>Espírito Santo, Brasil</span>
    </div>
    <div class="fila">
      <svg viewBox="0 0 48 48"><rect x="8" y="10" width="20" height="32" rx="2"/><path d="M28 20h12v22H28"/><path d="M14 17h3M20 17h3M14 24h3M20 24h3M14 31h3M20 31h3M33 27h3M33 34h3"/><path d="M4 42h40"/></svg>
      <b>Productor / Cooperativa</b><span>Carlos Alberto Roldi Filho</span>
    </div>
  </div>
  <div class="pie"><img src="logo-karu-esencial.png" alt="Karu Esencial"></div>
</section>
</body>
</html>
