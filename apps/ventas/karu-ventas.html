<style>
/* Layout: app de una columna pensada para celular; barra de pestañas abajo, hojas deslizables para formularios. */
:root{
  --bg:#f3f7fc; --surface:#ffffff; --surface-2:#eaf2fb; --ink:#13263b; --muted:#5a6e83; --line:#d8e4f0;

  --shadow:0 6px 24px rgba(19,38,59,.10);

  --r:14px; --logo-bg:transparent;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1925; --surface:#142537; --surface-2:#1a3048; --ink:#e7f0fa; --muted:#9db1c6; --line:#243a51;
  --brand:#5b9ff0; --brand-soft:#1d3a5c; --brand-ink:#a6cdfc; --on-brand:#ffffff;
  --warn:#f2aa55; --warn-bg:#3a2a14; --bad:#ff8f84; --bad-bg:#3d1f1d; --good:#64d29d; --good-bg:#133325;
  --shadow:0 6px 24px rgba(0,0,0,.35); --logo-bg:#ffffff; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1925; --surface:#142537; --surface-2:#1a3048; --ink:#e7f0fa; --muted:#9db1c6; --line:#243a51;
  --brand:#5b9ff0; --brand-soft:#1d3a5c; --brand-ink:#a6cdfc; --on-brand:#ffffff;
  --warn:#f2aa55; --warn-bg:#3a2a14; --bad:#ff8f84; --bad-bg:#3d1f1d; --good:#64d29d; --good-bg:#133325;
  --shadow:0 6px 24px rgba(0,0,0,.35); --logo-bg:#ffffff; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{height:46px;width:auto;flex:none;background:var(--logo-bg);border-radius:10px;padding:4px 7px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand small{font-size:13px;font-weight:600}
.brand h1{font-family:var(--f-display);font-size:19px;margin:0;line-height:1.1;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:var(--f-body)}
select.month{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:600;max-width:46vw}

h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px;font-weight:600}
.muted{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;margin-top:2px;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hero{grid-column:1/-1;background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

.alert b{font-weight:700}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.bar .track{grid-column:1/-1;height:9px;border-radius:9px;background:var(--surface-2);overflow:hidden}

.months{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:18px}
.months .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.months .b{width:100%;max-width:44px;background:var(--brand-soft);border-radius:6px 6px 2px 2px;position:relative}
.months .col.now .b{background:var(--brand)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

.tbl td{padding:6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.tbl table.pp td,.tbl table.pp th{font-size:12.5px;padding:6px 4px}
.fvar{font-size:11.5px;font-weight:700}.fvar.up{color:var(--good)}.fvar.down{color:var(--bad)}

.an-i.good{background:var(--good-bg)} .an-i.warn{background:var(--warn-bg)} .an-i.bad{background:var(--bad-bg)}

.be-rows{display:grid;gap:10px}
.be-row{display:grid;gap:5px;border-top:1px solid var(--line);padding-top:10px}
.be-row-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:15px}
.be-pct{font-weight:700;font-variant-numeric:tabular-nums;color:var(--brand-ink)}
.be-pct.pos{color:var(--good)}
.be-ok{color:var(--good);font-weight:600}
.be-goal2{font-size:14px;line-height:1.4}
.meter.sm{height:9px}
.be-det summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--brand-ink);padding:4px 0}
.be-list{display:grid;gap:6px;margin-top:8px}

.list{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;grid-column:1/-1}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.toolbar input[type=search]{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}

input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-width:0}
textarea{min-height:64px;resize:vertical}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form{display:grid;gap:12px}
.check{display:flex;gap:9px;align-items:center;font-weight:600;font-size:14px}
.check input{width:20px;height:20px;flex:none}
.items{display:grid;gap:8px}

.item select{grid-column:1/-1}

.item .lt{grid-column:1/-1;font-size:12.5px;color:var(--muted);text-align:right}

.item .x{border:0;background:var(--surface-2);border-radius:9px;height:38px;cursor:pointer;color:var(--muted);font-size:18px}

.totals{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:grid;gap:4px;font-size:14px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(9,1fr)}

<div class="wrap">

<script>
(function(){
const IVA = 0.19;
const LOGO = document.querySelector(".logo").src;
const CHANNELS = ["WhatsApp","Marketplace","Instagram","Facebook","Página web","Presencial"];
const PAYMENTS = ["Transferencia","Efectivo","Tarjeta"];
const DOCS = ["Pendiente","Boleta","Factura","Sin boleta"];
const EXP_CATS = ["Mercadería (vinagre, bicarbonato, percarbonato…)","Envases y etiquetas","Envíos y despacho","Publicidad (Facebook, Instagram)","Transporte y bencina","Servicios y suscripciones","Pago de impuestos (IVA, F29, TGR)","Otros"];
const TAX_CAT = "Pago de impuestos (IVA, F29, TGR)";
const IN_COST_CATS = ["Mercadería (vinagre, bicarbonato, percarbonato…)","Envases y etiquetas"];
const EXP_DOCS = ["Factura","Boleta","Sin documento"];
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

const S = { view:"inicio", month: ym(todayStr()), products:[], clients:[], sales:[], quotes:[], expenses:[], stock:[], moves:[], sii:[], biz:{}, ready:{p:0,c:0,s:0,q:0,b:0,e:0,k:0,m:0,i:0}, db:null, dl:null, saleFilter:"todas", clientQ:"" };
try{ const v = localStorage.getItem("karu.view"); if(v) S.view=v; }catch(e){}
try{ const p=localStorage.getItem("karu.finP"); if(["mes","anio","todo"].includes(p)) S.finP=p; const t=localStorage.getItem("karu.finT"); if(["an","er","bg","ind"].includes(t)) S.finT=t; }catch(e){}
try{ const a = localStorage.getItem("karu.anP"); if(["3m","anio","todo"].includes(a)) S.anP=a; }catch(e){}
try{ const m = localStorage.getItem("karu.beMode"); if(m==="mes"||m==="total") S.beMode=m; }catch(e){}

/* ---------- helpers ---------- */
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function ym(s){ return (s||"").slice(0,7); }
function money(n){ n=Math.round(Number(n)||0); return (n<0?"-$":"$")+Math.abs(n).toLocaleString("es-CL"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(s){ if(!s) return ""; const [y,m,d]=s.split("-"); return d+"/"+m+"/"+y; }
function monthLabel(k){ const [y,m]=k.split("-"); return MONTHS[+m-1].replace(/^./,c=>c.toUpperCase())+" "+y; }
function shortMonth(k){ const [y,m]=k.split("-"); return MONTHS[+m-1].slice(0,3); }
function addMonths(k,n){ let [y,m]=k.split("-").map(Number); m+=n; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return y+"-"+String(m).padStart(2,"0"); }
function daysSince(s){ if(!s) return null; const a=new Date(s+"T12:00:00"), b=new Date(todayStr()+"T12:00:00"); return Math.round((b-a)/864e5); }
function calc(sale){ const total=Number(sale.total)||0; const neto=Math.round(total/(1+IVA)); const iva=total-neto; const cost=(sale.items||[]).reduce((a,i)=>a+(Number(i.qty)||0)*(Number(i.unitCost)||0),0); return {total,neto,iva,cost,gain:neto-cost}; }
function itemDisc(i){ return Math.min(100,Math.max(0,Number(i.disc)||0)); }
function lineTotal(i){ return Math.round((Number(i.qty)||0)*(Number(i.unitPrice)||0)*(1-itemDisc(i)/100)); }
function lineLabel(i){ const full=(Number(i.qty)||0)*(Number(i.unitPrice)||0); return itemDisc(i)? `<s>${money(full)}</s> −${itemDisc(i)}% = <b>${money(lineTotal(i))}</b>` : `Total: <b>${money(full)}</b>`; }
function itemsText(items){ return (items||[]).map(i=>(i.qty>1?i.qty+" × ":"")+i.name+(itemDisc(i)?" (−"+itemDisc(i)+"%)":"")).join(", "); }
function norm(s){ return String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function opt(list,sel){ return list.map(v=>`<option${v===sel?" selected":""}>${esc(v)}</option>`).join(""); }
function activeProducts(){ return S.products.filter(p=>p.active!==false).sort((a,b)=>(a.order||0)-(b.order||0)||a.name.localeCompare(b.name)); }
function allReady(){ const r=S.ready; return r.p&&r.c&&r.s&&r.q&&r.b&&r.e&&r.k&&r.m&&r.i; }

/* ---------- inventario ---------- */
// Qué unidades de inventario consume cada producto al venderse
const USES = {"vinagre":[["vinagre",1]],"bicarbonato":[["bicarbonato",1]],"pack-vb":[["vinagre",1],["bicarbonato",1]],"pack-2-vinagres":[["vinagre",2]],"percarbonato":[["percarbonato",1]],"cafe-cultura":[["cafe",1]],"acido-citrico":[["acido-citrico",1]],"aceite-oliva-bidon":[["aceite",1]]};
function usesOf(item){ const p=S.products.find(p=>p.id===item.productId); if(p&&Array.isArray(p.uses)) return p.uses.map(u=>[u.s,u.q]); return USES[item.productId]||[]; }
function after(a,b){ return (a.date||"")>(b.date||"") || ((a.date||"")===(b.date||"") && (a.createdAt||"")>(b.createdAt||"")); }
function stockLevels(){
  const out={};
  S.stock.forEach(s=>{
    const mv=S.moves.filter(m=>m.stockId===s.id).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.createdAt||"").localeCompare(b.createdAt||""));
    let ci=-1; mv.forEach((m,i)=>{ if(m.type==="conteo") ci=i; });
    if(ci<0){ out[s.id]={counted:false,ready:0,bulk:0,sold:0}; return; }
    const c=mv[ci]; let ready=Number(c.ready)||0, bulk=Number(c.bulk)||0, sold=0;
    mv.slice(ci+1).forEach(m=>{ const q=Number(m.qty)||0;
      if(m.type==="entrada"){ if(m.to==="bulk") bulk+=q; else ready+=q; }
      else if(m.type==="dosificar"){ bulk-=q; ready+=q; }
      else if(m.type==="salida"){ ready-=q; } });
    S.sales.forEach(sa=>{ if(!after(sa,c)) return; (sa.items||[]).forEach(it=>usesOf(it).forEach(([sid,q])=>{ if(sid===s.id){ const n=(Number(it.qty)||0)*q; ready-=n; sold+=n; } })); });
    out[s.id]={counted:true,ready,bulk,sold,since:c.date};
  });
  return out;
}
function stockList(){ return [...S.stock].sort((a,b)=>(a.order||0)-(b.order||0)); }
function lowStock(){ const L=stockLevels(); return stockList().filter(s=>L[s.id].counted && L[s.id].ready<=(Number(s.min)||0)); }
function expCalc(x){ const total=Number(x.total)||0; const iva = x.doc==="Factura"? Math.min(total, Number(x.iva)||0) : 0; return {total, iva, net: total-iva}; }
function monthExp(k){ return S.expenses.filter(x=>ym(x.date)===k).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||"").localeCompare(a.createdAt||"")); }
function expSum(list){ return list.filter(x=>!x.advance).reduce((a,x)=>{ const c=expCalc(x); a.total+=c.total; a.iva+=c.iva; a.n++; if(x.category===TAX_CAT) a.tax+=c.total; else if(x.inCost) a.inCost+=c.net; else a.opex+=c.net; if(x.doc==="Factura") a.nFact++; return a; },{total:0,iva:0,opex:0,inCost:0,tax:0,n:0,nFact:0}); }

async function boot(){
  try{ S.db = await claude.use("db"); }catch(e){ S.db=null; }
  try{ S.dl = await claude.use("downloads"); }catch(e){ S.dl=null; }
  try{ S.mcp = await claude.use("mcp"); }catch(e){ S.mcp=null; }
  if(!S.db){ document.getElementById("main").innerHTML = `<div class="empty" style="margin-top:20px"><b>No se pudo abrir tu registro</b>Abre esta página desde tu cuenta de Claude para ver y guardar tus ventas.</div>`; return; }
  const sub=(name,key,assign)=>S.db.collection(name).onSnapshot(snap=>{ assign(snap.docs.map(d=>Object.assign({id:d.id},d.data()))); S.ready[key]=1; render(); }, err=>{ console.warn(name,err); S.ready[key]=1; render(); });
  sub("products","p",v=>S.products=v);
  sub("clients","c",v=>S.clients=v);
  sub("sales","s",v=>S.sales=v);
  sub("quotes","q",v=>S.quotes=v);
  sub("expenses","e",v=>S.expenses=v);
  sub("stock","k",v=>S.stock=v);
  sub("stockMoves","m",v=>S.moves=v);
  sub("siiMonths","i",v=>S.sii=v);
  S.db.doc("settings/balance").onSnapshot(d=>{ S.bal = d.exists? d.data():null; render(); }, ()=>{});
  S.db.doc("settings/business").onSnapshot(d=>{ S.biz = d.exists? d.data():{}; S.ready.b=1; render(); }, ()=>{ S.ready.b=1; render(); });
}
async function save(ref,data,ok){
  try{ await ref.set(data); if(ok) toast(ok); return true; }
  catch(e){ toast(e && e.code==="quota_exceeded" ? "Se llenó el espacio del registro." : "No se pudo guardar. Revisa tu conexión e intenta de nuevo."); console.warn(e); return false; }
}
async function ensureClient(name, phone, extra){
  const n=name.trim(); if(!n) return null; extra=extra||{};
  let c = S.clients.find(c=>norm(c.name)===norm(n));
  if(c){ const d=Object.assign({},c); delete d.id; let ch=false;
    if(phone && !c.phone){ d.phone=phone; ch=true; }
    if(extra.comuna && extra.comuna!==c.comuna){ d.comuna=extra.comuna; ch=true; }
    if(extra.origen && extra.origen!==c.origen){ d.origen=extra.origen; ch=true; }
    if(ch) await save(S.db.collection("clients").doc(c.id), d);
    return c.id; }
  const ref=S.db.collection("clients").doc();
  await save(ref,{name:n, phone:phone||"", notes:"", comuna:extra.comuna||"", origen:extra.origen||"", createdAt:new Date().toISOString()});
  return ref.id;
}

async function syncSheet(){
  if(!S.mcp){ S.sync={state:"error",msg:"La copia a Google Drive no está disponible al abrir la app desde aquí. Tus ventas siguen guardadas en la app.",at:""}; render(); return; }
  if(S.sync.state==="syncing"){ syncAgain=true; return; }
  S.sync={state:"syncing",msg:"",at:S.sync.at}; render();
  try{
    const rows=sheetRows();
    await S.mcp.callTool("Google Sheets","batch_clear_values",{spreadsheetId:SHEET_ID, ranges:[SHEET_TAB+"!A2:Q3000"]});
    if(rows.length) await S.mcp.callTool("Google Sheets","update_values",{spreadsheetId:SHEET_ID, range:SHEET_TAB+"!A2:Q"+(rows.length+1), values:rows});
    const erows=expRows();
    await S.mcp.callTool("Google Sheets","batch_clear_values",{spreadsheetId:SHEET_ID, ranges:[EXP_TAB+"!A2:K3000"]});
    if(erows.length) await S.mcp.callTool("Google Sheets","update_values",{spreadsheetId:SHEET_ID, range:EXP_TAB+"!A2:K"+(erows.length+1), values:erows});
    const frows=finSheetValues();
    await S.mcp.callTool("Google Sheets","batch_clear_values",{spreadsheetId:SHEET_ID, ranges:[FIN_TAB+"!A1:O400"]});
    await S.mcp.callTool("Google Sheets","update_values",{spreadsheetId:SHEET_ID, range:FIN_TAB+"!A1:O"+frows.length, values:frows});
    const crows=clientSheetValues();
    await S.mcp.callTool("Google Sheets","batch_clear_values",{spreadsheetId:SHEET_ID, ranges:[CLI_TAB+"!A1:N2000"]});
    await S.mcp.callTool("Google Sheets","update_values",{spreadsheetId:SHEET_ID, range:CLI_TAB+"!A1:N"+crows.length, values:crows});
    const d=new Date(); S.sync={state:"ok",msg:"",at:String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
  }catch(e){
    const code=e&&e.code;
    const msg = code==="server_not_connected"||code==="needs_reauth" ? "Google Sheets no está conectado. Conéctalo en claude.ai → Configuración → Conectores y toca Copiar ahora."
      : code==="not_in_manifest"||code==="approval_required"||code==="consent_required" ? "Falta darle permiso a la app para usar Google Sheets. Toca Copiar ahora y elige Permitir."
      : code==="tool_error" ? "Google Sheets rechazó la copia. Revisa que la planilla Ventas y sus pestañas Ventas App, Gastos App, Finanzas App y Clientes App sigan existiendo."
      : "No se pudo copiar a Google Drive en este momento. Tus ventas siguen guardadas en la app; toca Copiar ahora para reintentar.";
    S.sync={state:"error",msg,at:S.sync.at}; console.warn("sync",e);
  }
  render();
  if(syncAgain){ syncAgain=false; scheduleSync(); }
}
function syncLine(){
  const s=S.sync;
  if(s.state==="syncing") return `<div class="alert good" style="cursor:default">⟳ <span>Copiando tus ventas, gastos, finanzas y clientes a Google Drive…</span></div>`;
  if(s.state==="ok") return `<div class="alert good">✓ <span>Copia en Google Drive al día (${esc(s.at)}).</span></div>`;
  if(s.state==="error") return `<button class="alert bad" type="button" data-act="syncNow">⚠ <span>${esc(s.msg)}</span></button>`;
  return "";
}

function setMonthOptions(){
  const sel=document.getElementById("month");
  const keys=new Set([ym(todayStr())]);
  S.sales.forEach(s=>s.date&&keys.add(ym(s.date)));
  S.expenses.forEach(x=>x.date&&keys.add(ym(x.date)));
  for(let i=1;i<6;i++) keys.add(addMonths(ym(todayStr()),-i));
  const arr=[...keys].sort().reverse();
  sel.innerHTML = arr.map(k=>`<option value="${k}"${k===S.month?" selected":""}>${monthLabel(k)}</option>`).join("");
  sel.hidden = !(S.view==="inicio"||S.view==="ventas"||S.view==="gastos"||(S.view==="finanzas"&&(S.finP||"mes")!=="todo"));
}

function sumUp(list){ return list.reduce((a,s)=>{ const c=calc(s); a.total+=c.total;a.neto+=c.neto;a.iva+=c.iva;a.cost+=c.cost;a.gain+=c.gain;a.n++; if(s.doc==="Boleta"||s.doc==="Factura") a.ivaDoc+=c.iva; return a; },{total:0,neto:0,iva:0,cost:0,gain:0,n:0,ivaDoc:0}); }

}

// ===== Punto de equilibrio por producto =====
function baseProductFor(sid){
  const cands=S.products.filter(p=>{ const u=usesOf({productId:p.id}); return u.length===1 && u[0][0]===sid && Number(u[0][1])===1 && Number(p.price)>0; });
  cands.sort((a,b)=>((b.active!==false)-(a.active!==false))||(/oferta/i.test(a.name||"")-/oferta/i.test(b.name||""))||((a.order||0)-(b.order||0)));
  return cands[0]||null;
}
// Líneas de producto = lo que tienes en Stock (+ otras que aparezcan en ventas o compras, como el aceite)
function peLines(){
  const ids=[]; const add=id=>{ if(id && id!=="varios" && !ids.includes(id)) ids.push(id); };
  stockList().forEach(s=>add(s.id));
  S.products.forEach(p=>usesOf({productId:p.id}).forEach(([sid])=>add(sid)));
  S.expenses.forEach(x=>{ add(x.product); if(x.alloc) Object.keys(x.alloc).forEach(add); });
  return ids.map(id=>{ const st=S.stock.find(s=>s.id===id); const bp=baseProductFor(id); return {id, name: bp? bp.name : (st? st.name : id), price: bp? Number(bp.price)||0 : 0, stock: st||null}; });
}
function expAlloc(x){ // reparte el neto de un gasto entre productos; lo que no tiene producto queda como "compartido"
  const net=expCalc(x).net, out={}; let used=0;
  if(x.product && x.product!=="varios"){ out[x.product]=net; return out; }
  if(x.product==="varios" && x.alloc){ Object.entries(x.alloc).forEach(([k,v])=>{ v=Math.max(0,Math.min(net-used,Number(v)||0)); if(v){ out[k]=(out[k]||0)+v; used+=v; } }); }
  if(net-used>0) out._shared=(out._shared||0)+(net-used);
  return out;
}
function breakEven(mode){
  const sales = mode==="mes"? S.sales.filter(s=>ym(s.date)===S.month) : S.sales;
  const exps = (mode==="mes"? S.expenses.filter(x=>ym(x.date)===S.month) : S.expenses).filter(x=>x.category!==TAX_CAT && !x.advance);
  const lines=peLines(); const P={}; lines.forEach(l=>P[l.id]={...l, inv:0, rec:0, owed:0, units:0});
  const SH={inv:0, rec:0, owed:0}; // compartido
  const priceOf=id=>(P[id]&&P[id].price)||1;
  exps.forEach(x=>Object.entries(expAlloc(x)).forEach(([k,v])=>{ if(k==="_shared"||!P[k]) SH.inv+=v; else P[k].inv+=v; }));
  sales.forEach(s=>{ const c=calc(s); const base=(s.items||[]).reduce((a,i)=>a+lineTotal(i),0); if(!base) return; const key=s.paid===false?"owed":"rec";
    (s.items||[]).forEach(i=>{ const n=c.neto*lineTotal(i)/base; const u=usesOf(i);
      if(!u.length){ SH[key]+=n; return; }
      const w=u.reduce((a,[sid,q])=>a+q*priceOf(sid),0)||1;
      u.forEach(([sid,q])=>{ const t=P[sid]; const part=n*q*priceOf(sid)/w; if(!t){ SH[key]+=part; return; } t[key]+=part; if(s.paid!==false) t.units+=(Number(i.qty)||0)*q; }); }); });
  const L=stockLevels();
  const rows=Object.values(P).filter(p=>p.inv>0||p.rec>0||p.owed>0).map(p=>{
    const miss=Math.max(0,p.inv-p.rec), missGross=Math.round(miss*(1+IVA)); const l=L[p.id];
    const have = l&&l.counted? Math.max(0,(Number(l.ready)||0)+(Number(l.bulk)||0)) : null;
    return {...p, miss, missGross, extra:Math.max(0,p.rec-p.inv), pct: p.inv>0? Math.min(100,p.rec/p.inv*100) : 100, need: p.price? Math.ceil(missGross/p.price) : 0, have};
  }).sort((a,b)=>b.inv-a.inv);
  const surplus=rows.reduce((a,r)=>a+r.extra,0);
  const inv=rows.reduce((a,r)=>a+r.inv,0)+SH.inv, rec=rows.reduce((a,r)=>a+r.rec,0)+SH.rec, owed=rows.reduce((a,r)=>a+r.owed,0)+SH.owed;
  let u=0, amt=0; S.sales.forEach(s=>(s.items||[]).forEach(i=>{ if(!usesOf(i).length) return; const q=Number(i.qty)||0; if(q<=0) return; u+=q; amt+=lineTotal(i); }));
  return {rows, SH, surplus, inv, rec, owed, missNet:Math.max(0,inv-rec), missGross:Math.round(Math.max(0,inv-rec)*(1+IVA)), pct: inv>0? Math.min(100,rec/inv*100) : (rec>0?100:0), avg: u? amt/u : 0, nExp:exps.length};
}
function breakEvenCard(){

  // una tarjeta por producto

      <div class="meter sm"><div style="width:${Math.max(2,r.pct)}%"></div></div>
      <div class="be-goal2">${goal}<span class="muted">${st}</span></div>
      <div class="muted be-note">Invertido ${money(r.inv)} · recuperado ${money(r.rec)}${r.units?` (${r.units} ${r.units===1?"unidad vendida":"unidades vendidas"})`:""}${r.owed>0?` · por cobrar ${money(Math.round(r.owed*(1+IVA)))}`:""}</div></div>`;
  }).join("")+`</div>`;
  // compartidos
  if(b.SH.inv>0){
    const cover=b.SH.rec+b.surplus; const pct=Math.min(100,cover/b.SH.inv*100); const miss=Math.max(0,b.SH.inv-cover);

      <div class="muted be-note">Para asignar un gasto a un producto, ábrelo en <b>Gastos</b> y elige "¿Para qué producto?".</div></div>`;
  }
  h+=`<p class="muted be-note">Invertido = compras ${esc(label)} sin el IVA de las facturas y sin pagos de impuestos. Recuperado = ventas pagadas sin IVA. Los packs se reparten entre sus productos.</p></div>`;

function finRange(p){
  const y=Number(S.month.slice(0,4)), cur=ym(todayStr());
  if(p==="mes"){ const pm=addMonths(S.month,-1); return {lbl:monthLabel(S.month)+(S.month===cur?" (en curso)":""), f:d=>ym(d)===S.month, months:1, prev:{lbl:monthLabel(pm), f:d=>ym(d)===pm}}; }
  if(p==="anio"){ const nm = String(y)===cur.slice(0,4)? Number(cur.slice(5,7)) : 12; return {lbl:"Año "+y+(String(y)===cur.slice(0,4)?" (hasta hoy)":""), f:d=>(d||"").slice(0,4)===String(y), months:nm, prev:{lbl:"Año "+(y-1), f:d=>(d||"").slice(0,4)===String(y-1)}}; }
  const ks=[...S.sales.map(s=>ym(s.date)),...S.expenses.map(x=>ym(x.date))].filter(Boolean).sort(); let nm=1; if(ks.length){ let k=ks[0]; nm=0; while(k<=cur){ nm++; k=addMonths(k,1); } }
  return {lbl:"Desde el inicio", f:()=>true, months:nm, prev:null};
}
function incomeStmt(f){
  const sales=S.sales.filter(s=>f(s.date)), exps=S.expenses.filter(x=>f(x.date));
  let gross=0, neto=0, cost=0; sales.forEach(s=>{ const c=calc(s); gross+=c.total; neto+=c.neto; cost+=c.cost; });
  const opex={}; let opexT=0, purch=0, taxPaid=0;
  exps.forEach(x=>{ if(x.advance) return; const c=expCalc(x); if(x.category===TAX_CAT){ taxPaid+=c.total; return; } purch+=c.net; if(x.inCost) return; const k=(x.category||"Otros").split(" (")[0]; opex[k]=(opex[k]||0)+c.net; opexT+=c.net; });
  const gm=neto-cost, op=gm-opexT;
  return {sales, n:sales.length, gross, iva:gross-neto, neto, cost, gm, opex, opexT, op, purch, cash:neto-purch, taxPaid};
}
function balanceSheet(){
  const bi=balanceInfo(); const bank=bi? bi.est : 0;
  const ar=S.sales.filter(s=>s.paid===false).reduce((a,s)=>a+(Number(s.total)||0),0);
  const L=stockLevels(); let inv=0; const invTxt=[], uncounted=[];
  stockList().forEach(st=>{ const l=L[st.id]; if(!l||!l.counted){ uncounted.push(st.name); return; } const q=Math.max(0,(Number(l.ready)||0)+(Number(l.bulk)||0)); const bp=baseProductFor(st.id); const c=bp? Number(bp.cost)||0 : 0; if(q&&c){ inv+=q*c; invTxt.push(q+" "+st.name); } });
  const cm=ym(todayStr()); const t=sumUp(monthSales(cm)); const ex=expSum(monthExp(cm)); const ivaNet=t.ivaDoc-ex.iva;
  const ivaFavor=Math.max(0,-ivaNet), ivaPay=Math.max(0,ivaNet);
  // IVA de ventas de meses pasados que no se declaró (ventas sin boleta): diferencia entre el IVA de todas las ventas y lo declarado en el SII
  let ivaOld=0; S.sii.forEach(m=>{ if(!m.id || m.id>=cm) return; const iv=monthSales(m.id).reduce((a,s)=>a+calc(s).iva,0); ivaOld+=Math.max(0, iv-(Number(m.iva)||0)); });
  const adv=S.expenses.filter(x=>x.advance).reduce((a,x)=>a+(Number(x.total)||0),0);
  const assets=bank+ar+inv+ivaFavor+adv, liab=ivaPay+ivaOld;
  const resAcum=incomeStmt(()=>true).op; const equity=assets-liab; const capital=equity-resAcum;
  return {hasBank:!!bi, bi, bank, ar, inv, invTxt, uncounted, ivaFavor, ivaPay, ivaOld, adv, assets, liab, resAcum, equity, capital};
}
function prodProfit(sales){
  const P={}; sales.forEach(s=>{ const c=calc(s); const base=(s.items||[]).reduce((a,i)=>a+lineTotal(i),0)||1;
    (s.items||[]).forEach(i=>{ if(!usesOf(i).length && !(Number(i.unitCost)>0)) return; const pl=prodLine(i); const k=pl.name; const n=c.neto*lineTotal(i)/base, co=(Number(i.qty)||0)*(Number(i.unitCost)||0);
      P[k]=P[k]||{name:k,u:0,neto:0,cost:0}; P[k].u+=pl.u; P[k].neto+=n; P[k].cost+=co; }); });
  return Object.values(P).map(p=>({...p, gm:p.neto-p.cost, pct:p.neto? (p.neto-p.cost)/p.neto*100 : 0})).sort((a,b)=>b.gm-a.gm);

function pctS(v){ return (isFinite(v)? (Math.round(v*10)/10).toLocaleString("es-CL") : "–")+"%"; }
function varS(a,b){ if(!b) return ""; const v=(a-b)/Math.abs(b)*100; return `<span class="fvar ${v>=0?"up":"down"}">${v>=0?"▲":"▼"} ${Math.abs(Math.round(v))}%</span>`; }

// ===== Análisis financiero automático (se recalcula con cada venta, gasto o conteo) =====
function finAnalysis(){
  const out=[]; const add=(tone,text)=>out.push({tone,text});
  const today=todayStr(), cm=ym(today), pm=addMonths(cm,-1); const day=Number(today.slice(8,10)); const dim=new Date(Number(cm.slice(0,4)),Number(cm.slice(5,7)),0).getDate();
  const mon=k=>monthLabel(k).split(" ")[0].toLowerCase();
  const Ic=incomeStmt(d=>ym(d)===cm), Ip=incomeStmt(d=>ym(d)===pm);
  const last6=[]; for(let i=1;i<=6;i++) last6.push(addMonths(cm,-i));
  const avg6=last6.reduce((a,k)=>a+incomeStmt(d=>ym(d)===k).gross,0)/6;
  // 1. Ventas del mes
  if(Ic.n){ const proj=Math.round(Ic.gross/Math.max(1,day)*dim);
    let t=`En ${mon(cm)} llevas ${money(Ic.gross)} vendidos (con IVA) en ${Ic.n} ${Ic.n===1?"venta":"ventas"}`;
    if(Ip.gross) t+=`, ${Ic.gross>=Ip.gross?"más":"menos"} que todo ${mon(pm)} (${money(Ip.gross)})`;
    t+="."; if(day<dim) t+=` A este ritmo cerrarías el mes cerca de ${money(proj)}.`;
    add(avg6&&proj>=avg6?"good":"warn", t+(avg6?` Tu promedio de los últimos 6 meses es ${money(Math.round(avg6))} al mes.`:""));
  } else add("warn",`Aún no hay ventas registradas en ${mon(cm)}.${avg6?` Tu promedio de los últimos 6 meses es ${money(Math.round(avg6))} al mes.`:""}`);
  // 2. Margen
  const all=incomeStmt(()=>true); const gm=all.neto? all.gm/all.neto*100 : 0;
  const r3=[1,2,3].map(i=>incomeStmt(d=>ym(d)===addMonths(cm,-i))); const n3=r3.reduce((a,r)=>a+r.neto,0), g3=r3.reduce((a,r)=>a+r.gm,0); const gm3=n3? g3/n3*100 : null;
  if(all.neto) add(gm>=40?"good":gm>=25?"warn":"bad", `Tu margen bruto es ${pctS(gm)}: de cada $100 vendidos sin IVA te quedan $${Math.round(gm)} después de pagar el producto${gm>=40?" (saludable)":gm>=25?" (aceptable, pero ajustado)":" (bajo: revisa precios o costos)"}.${gm3!=null&&Math.abs(gm3-gm)>=3?` En los últimos 3 meses fue ${pctS(gm3)}, ${gm3>gm?"mejor":"peor"} que tu promedio.`:""}`);
  // 3. Productos
  const pp=prodProfit(S.sales); const tg=pp.reduce((a,p)=>a+Math.max(0,p.gm),0);
  if(pp.length&&tg){ const top=pp[0]; add("info", `${top.name} es tu producto estrella: aporta el ${Math.round(top.gm/tg*100)}% de tu ganancia bruta (${money(top.gm)} en ${top.u} ${top.u===1?"unidad":"unidades"}).`);
    const low=pp.filter(p=>p.u>0 && p.pct<30); if(low.length) add("warn", `Margen bajo en: ${low.map(p=>`${p.name} (${Math.round(p.pct)}%)`).join(", ")}. Revisa si su precio cubre bien el costo.`); }
  // 4. Punto de equilibrio por producto
  const be=breakEven("total"); const near=be.rows.filter(r=>r.miss>0 && r.price && r.need<=5 && r.stock && (r.have==null || r.have>=r.need)), done=be.rows.filter(r=>r.miss<=0);
  if(done.length) add("good", `Ya recuperaste lo invertido en: ${done.map(r=>r.name).join(", ")}.`);
  if(near.length) add("info", `Muy cerca de recuperar lo invertido: ${near.map(r=>`${r.name} (faltan ${r.need})`).join(", ")}.`);
  be.rows.filter(r=>r.miss>0 && r.have!=null && r.price && r.have<r.need).forEach(r=>add("warn", `${r.name}: te faltan ${r.need} unidades para recuperar lo invertido y solo tienes ${r.have} en stock. Para recuperarlo necesitas reponer.`));
  if(be.pct<100) add("info", `En total llevas recuperado el ${Math.floor(be.pct)}% de lo invertido; faltan ${money(be.missGross)} en ventas con IVA.`);
  if(be.SH.inv>0) add("info", `Hay ${money(be.SH.inv)} en gastos compartidos (envases, etiquetas, etc.) sin asignar a un producto. Si los asignas en Gastos, el punto de equilibrio por producto será más exacto.`);
  // 5. Clientes
  const lastBuy={}, cnt={}; S.sales.forEach(s=>{ const k=s.clientId||s.clientName; if(!k) return; cnt[k]=(cnt[k]||0)+1; if(!lastBuy[k]||s.date>lastBuy[k]) lastBuy[k]=s.date; });
  const nCl=Object.keys(cnt).length, rep=Object.values(cnt).filter(v=>v>1).length;
  const d60=new Date(); d60.setDate(d60.getDate()-60); const s60=d60.toISOString().slice(0,10); const asleep=Object.entries(lastBuy).filter(([k,d])=>d<s60).length;
  if(nCl) add(rep/nCl>=0.4?"good":rep/nCl>=0.2?"warn":"bad", `${rep} de ${nCl} clientes (${Math.round(rep/nCl*100)}%) te han comprado más de una vez. ${asleep?`Hay ${asleep} clientes que no compran hace más de 60 días: un mensaje por WhatsApp ofreciendo reponer vinagre o percarbonato puede traer ventas fáciles.`:""}`);

  const startOf=sid=> first[sid]&&first[sid]>s90? first[sid] : s90;
  const daysFrom=d=>Math.max(7,Math.round((new Date(todayStr())-new Date(d))/86400000));
  const sold90={}; S.sales.forEach(s=>(s.items||[]).forEach(i=>usesOf(i).forEach(([sid,q])=>{ if((s.date||"")>=startOf(sid)) sold90[sid]=(sold90[sid]||0)+(Number(i.qty)||0)*q; })));
  const slow=[]; stockList().forEach(st=>{ const l=L[st.id]; if(!l||!l.counted) return; const q=(Number(l.ready)||0)+(Number(l.bulk)||0); if(q<=0) return; const bp=baseProductFor(st.id); const v=q*(bp?Number(bp.cost)||0:0); const rate=(sold90[st.id]||0)/daysFrom(startOf(st.id)); slow.push({name:st.name,q,v,days: rate? q/rate : Infinity}); });
  slow.sort((a,b)=>b.v-a.v);
  if(B.inv>0){ const big=slow[0]; add(slow.some(x=>x.days>120)?"warn":"good", `Tienes ${money(B.inv)} en stock (a costo).${big?` Lo que más plata inmoviliza es ${big.name}: ${big.q} unidades (${money(big.v)})${isFinite(big.days)?`, que al ritmo actual se venden en unos ${Math.round(big.days)} días`:", sin ventas recientes"}.`:""}`); }
  slow.filter(x=>x.q>0 && x.q<=3 && isFinite(x.days) && x.days<30).forEach(x=>add("warn", `${x.name}: quedan ${x.q} y se venden rápido. Considera reponer pronto.`));
  // 7. Caja y cobros
  const owed=S.sales.filter(s=>s.paid===false); if(owed.length) add("warn", `Te deben ${money(owed.reduce((a,s)=>a+(Number(s.total)||0),0))} en ${owed.length} ${owed.length===1?"venta":"ventas"} por cobrar.`);
  if(B.hasBank) add("info", `Saldo estimado en el banco hoy: ${money(B.bank)}.`);
  // 8. Impuestos
  const t=sumUp(monthSales(cm)), ex=expSum(monthExp(cm)); const ivaNet=t.ivaDoc-ex.iva;
  add("info", `F29 de ${mon(cm)} (vence el 20 de ${mon(addMonths(cm,1))}): ${ivaNet>=0?`IVA a pagar estimado ${money(ivaNet)}`:`IVA a tu favor estimado ${money(-ivaNet)}`} según las boletas y facturas registradas hasta hoy.`);
  const pend=S.sales.filter(s=>s.doc==="Pendiente"); if(pend.length) add("warn", `${pend.length} ${pend.length===1?"venta espera":"ventas esperan"} boleta. Emítelas para que el IVA quede bien declarado.`);
  if(B.ivaOld>0) add("bad", `Hay ${money(B.ivaOld)} de IVA de ventas sin boleta de meses anteriores que no está declarado. Conviene regularizarlo con tu contador (rectificando los F29).`);
  // 9. Calidad de datos
  // meses donde el SII tiene más boletas (en pesos) que todas las ventas registradas en la app
  const gaps=[...S.sii].sort((a,b)=>a.id.localeCompare(b.id)).filter(m=>m.id<cm && Number(m.total)>0 && sumUp(monthSales(m.id)).total < Number(m.total)*0.95).map(m=>`${mon(m.id)} (SII ${money(m.total)}, app ${money(sumUp(monthSales(m.id)).total)})`);
  if(gaps.length) add("bad", `Faltan ventas en la app: ${gaps.join("; ")}. En ${gaps.length===1?"ese mes":"esos meses"} el SII tiene más boletas que todas las ventas registradas, así que sus resultados no son confiables.`);
  const unc=stockList().filter(st=>!(L[st.id]&&L[st.id].counted)).map(st=>st.name); if(unc.length) add("info", `Falta contar el stock de: ${unc.join(", ")}.`);
  return out;
}

async function submitMove(){
  const g=id=>document.getElementById(id); const t=sheetState.type;
  const d={stockId:sheetState.stockId,type:t,date:g("m-date").value||todayStr(),note:g("m-note").value.trim(),createdAt:sheetState.createdAt||new Date().toISOString()};
  if(t==="conteo"){ d.ready=Math.max(0,Number(g("m-ready").value)||0); d.bulk=g("m-bulk")?Math.max(0,Number(g("m-bulk").value)||0):0; }
  else { d.qty=Math.max(0,Number(g("m-qty").value)||0); if(!d.qty){ toast("Escribe una cantidad."); return; } if(t==="entrada") d.to=g("m-to")?g("m-to").value:"ready"; }
  const ref= sheetState.id? S.db.collection("stockMoves").doc(sheetState.id) : S.db.collection("stockMoves").doc();
  if(await save(ref,d,"Inventario actualizado")){ closeSheet(); render(); }
}

function clientStats(){
  const m={}; S.sales.forEach(s=>{ const k=s.clientId||("n:"+norm(s.clientName)); m[k]=m[k]||{n:0,total:0,gain:0,last:""}; const c=calc(s); m[k].n++; m[k].total+=c.total; m[k].gain+=c.gain; if((s.date||"")>m[k].last) m[k].last=s.date; });
  return m;

/* ===== Análisis comercial: comunas, productos, canales y clientes ===== */
const COMUNAS=["Concepción","San Pedro de la Paz","Chiguayante","Talcahuano","Hualpén","Penco","Tomé","Coronel","Lota","Hualqui","Otra comuna"];
const ORIGENES=["Instagram","Facebook","Marketplace","Recomendación de un cliente","Familia o amigos","Página web","En persona / feria","Otro"];
function optBlank(list,sel,blank){ return `<option value=""${sel?"":" selected"}>${esc(blank)}</option>`+list.map(v=>`<option${v===sel?" selected":""}>${esc(v)}</option>`).join("")+(sel&&!list.includes(sel)?`<option selected>${esc(sel)}</option>`:""); }
// Todas las variantes de café (250 g, 1 kg, 2 kg, ofertas y precios de cafetería) se agrupan como un solo producto, contado en bolsas de 250 g.
const CAFE_LINE="Café Carlos Roldi";
function prodLine(i){ const u=usesOf(i); const q=Number(i.qty)||0; if(u.length===1 && u[0][0]==="cafe") return {name:CAFE_LINE, u:q*(Number(u[0][1])||1)}; if(/caf[eé]/i.test(i.name||"") && /roldi/i.test(i.name||"")) return {name:CAFE_LINE, u:q}; return {name:i.name||"Producto", u:q}; }
function unitLbl(name,u){ return name===CAFE_LINE? `${u} ${u===1?"bolsa":"bolsas"}` : `${u} u.`; }
function isDelivery(i){ return /^despacho/i.test(i.productId||"") || /^despacho/i.test(i.name||""); }
function clientKey(s){ return s.clientId||("n:"+norm(s.clientName)); }
function clientOf(s){ return (s.clientId&&S.clients.find(c=>c.id===s.clientId)) || S.clients.find(c=>norm(c.name)===norm(s.clientName)) || null; }
function saleComuna(s){ const c=clientOf(s); return s.comuna || (c&&c.comuna) || ""; }
function firstName(n){ return String(n||"").trim().split(/[\s(]+/)[0]||""; }
function waLink(phone,text){ let d=String(phone||"").replace(/\D/g,""); if(!d) return ""; if(d.length===9&&d[0]==="9") d="56"+d; else if(d.length===8) d="569"+d; return "https://wa.me/"+d+"?text="+encodeURIComponent(text); }
function clientMetrics(){
  const M={};
  [...S.sales].sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.createdAt||"").localeCompare(b.createdAt||"")).forEach(s=>{
    const k=clientKey(s); const c=clientOf(s); const t=calc(s);
    const m=M[k]=M[k]||{key:k, id:c?c.id:"", name:c?c.name:(s.clientName||"Sin nombre"), phone:c&&c.phone||"", comuna:"", origen:c&&c.origen||"", dates:[], n:0, total:0, gain:0, prods:{}, firstChannel:"", firstProducts:[]};
    if(!m.dates.length){ m.firstChannel=s.channel||""; m.firstProducts=(s.items||[]).filter(i=>!isDelivery(i)).map(i=>prodLine(i).name); }
    m.dates.push(s.date||""); m.n++; m.total+=t.total; m.gain+=t.gain; if(s.comuna) m.comuna=s.comuna;
    (s.items||[]).filter(i=>!isDelivery(i)).forEach(i=>{ const pl=prodLine(i); m.prods[pl.name]=(m.prods[pl.name]||0)+pl.u; });
  });
  Object.values(M).forEach(m=>{
    const c=m.id&&S.clients.find(x=>x.id===m.id); if(c&&c.comuna) m.comuna=c.comuna;
    m.first=m.dates[0]; m.last=m.dates[m.dates.length-1]; m.days=daysSince(m.last);
    const gaps=[]; for(let i=1;i<m.dates.length;i++){ const g=Math.round((new Date(m.dates[i]+"T12:00:00")-new Date(m.dates[i-1]+"T12:00:00"))/864e5); if(g>0) gaps.push(g); }
    m.gap= gaps.length? gaps.reduce((a,b)=>a+b,0)/gaps.length : null;
    const f=Object.entries(m.prods).sort((a,b)=>b[1]-a[1])[0]; m.fav=f?f[0]:"";
    m.status = m.days!=null && m.days>180? "Inactivo" : m.n>1? "Recurrente" : "Nuevo";
  });
  return M;
}
function anRange(p){ const cur=ym(todayStr());
  if(p==="3m"){ const from=addMonths(cur,-2)+"-01"; return {lbl:"Últimos 3 meses", f:d=>(d||"")>=from}; }
  if(p==="anio"){ const y=cur.slice(0,4); return {lbl:"Año "+y, f:d=>(d||"").slice(0,4)===y}; }
  return {lbl:"Desde el inicio", f:()=>true}; }
function marketData(p){
  const R=anRange(p); const M=clientMetrics(); const sales=S.sales.filter(s=>R.f(s.date));
  const tot=sales.reduce((a,s)=>a+calc(s).total,0);
  const buyers=[...new Set(sales.map(clientKey))]; const nuevos=buyers.filter(k=>M[k]&&R.f(M[k].first));
  const repeat=buyers.filter(k=>M[k]&&M[k].n>1).length;
  const C={}; sales.forEach(s=>{ const k=saleComuna(s)||"Sin comuna"; C[k]=C[k]||{name:k,total:0,n:0,cl:new Set()}; C[k].total+=calc(s).total; C[k].n++; C[k].cl.add(clientKey(s)); });
  const comunas=Object.values(C).map(x=>({name:x.name,total:x.total,n:x.n,nc:x.cl.size,ticket:x.total/x.n})).sort((a,b)=>(a.name==="Sin comuna")-(b.name==="Sin comuna")||b.total-a.total);
  const P={}; sales.forEach(s=>{ const sub=(s.items||[]).reduce((a,i)=>a+lineTotal(i),0)||1; const t=calc(s).total; (s.items||[]).filter(i=>!isDelivery(i)).forEach(i=>{ const pl=prodLine(i); const k=pl.name; P[k]=P[k]||{name:k,u:0,total:0,cl:new Set()}; P[k].u+=pl.u; P[k].total+=t*lineTotal(i)/sub; P[k].cl.add(clientKey(s)); }); });
  const prods=Object.values(P).map(x=>({name:x.name,u:x.u,total:x.total,nc:x.cl.size})).sort((a,b)=>b.total-a.total);
  const K={}; const ch=k=>K[k]=K[k]||{name:k,total:0,n:0,nuevos:0};
  sales.forEach(s=>{ const c=ch(s.channel||"Sin canal"); c.total+=calc(s).total; c.n++; });
  nuevos.forEach(k=>{ ch(M[k].firstChannel||"Sin canal").nuevos++; });
  const canales=Object.values(K).sort((a,b)=>(a.name==="Sin canal")-(b.name==="Sin canal")||b.total-a.total);
  const O={}; buyers.forEach(k=>{ const o=(M[k]&&M[k].origen)||"Sin dato"; O[o]=(O[o]||0)+1; });
  const origenes=Object.entries(O).sort((a,b)=>(a[0]==="Sin dato")-(b[0]==="Sin dato")||b[1]-a[1]);
  const E={}; nuevos.forEach(k=>[...new Set(M[k].firstProducts)].forEach(n=>E[n]=(E[n]||0)+1));
  const entrada=Object.entries(E).sort((a,b)=>b[1]-a[1]);
  return {R,M,sales,tot,buyers,nuevos,repeat,comunas,prods,canales,origenes,entrada};
}
function monthlyClients(){ const M=clientMetrics(); const cur=ym(todayStr()); const out=[];
  for(let i=5;i>=0;i--){ const k=addMonths(cur,-i); const ks=new Set(S.sales.filter(s=>ym(s.date)===k).map(clientKey)); let nw=0,rt=0; ks.forEach(c=>{ if(M[c]&&ym(M[c].first)===k) nw++; else rt++; }); out.push({k,nw,rt}); }
  return out; }

function toContact(M){ return Object.values(M).filter(m=>{ if(m.days==null) return false; const lim = m.gap? Math.max(30, Math.round(m.gap*1.3)) : 45; return m.days>=lim && m.days<=365; }).sort((a,b)=>b.total-a.total); }

function gapsAlert(){ const G=dataGaps(); const parts=[G.noComuna?`<b>${G.noComuna}</b> ${G.noComuna===1?"cliente":"clientes"} sin comuna`:"", G.noOrigen?`<b>${G.noOrigen}</b> sin "cómo nos conoció"`:"", G.noCanal?`<b>${G.noCanal}</b> ${G.noCanal===1?"venta":"ventas"} sin canal`:""].filter(Boolean);
  return parts.length? `<button class="alert warn" type="button" data-act="fillData">📝 <span>Faltan datos para el análisis: ${parts.join(", ")}. Toca aquí para completarlos.</span></button>` : ""; }
function marketInsights(D){
  const out=[]; const add=(tone,text)=>out.push({tone,text});
  const known=D.comunas.filter(c=>c.name!=="Sin comuna"); const tk=known.reduce((a,c)=>a+c.total,0);
  if(known.length){ const top=known[0]; add("info",`${top.name} es tu comuna principal: ${Math.round(top.total/Math.max(1,tk)*100)}% de lo vendido con comuna conocida (${top.nc} ${top.nc===1?"cliente":"clientes"}).`);
    const best=known.filter(c=>c.n>=2).sort((a,b)=>b.ticket-a.ticket)[0]; if(best&&best.name!==top.name) add("info",`En ${best.name} compran más por pedido: ${money(best.ticket)} en promedio. Una buena zona para ofrecer packs.`);
    const sin=COMUNAS.filter(c=>c!=="Otra comuna" && !known.some(k=>k.name===c)); if(sin.length) add("info",`Comunas con despacho donde no tuviste ventas en este periodo: ${sin.join(", ")}. Una publicación segmentada a esas comunas puede traerte clientes nuevos.`); }
  else add("warn","Todavía no hay comunas registradas. Completa la comuna de tus clientes para ver dónde se concentran tus ventas.");
  const sc=D.comunas.find(c=>c.name==="Sin comuna"); if(sc&&known.length) add("warn",`${Math.round(sc.total/Math.max(1,D.tot)*100)}% de lo vendido aún no tiene comuna. Mientras más completes, más exacto es el análisis.`);
  if(D.prods.length){ const p=D.prods[0]; add("info",`${p.name} es lo que más vendes: ${money(p.total)} en ${p.u} ${p.u===1?"unidad":"unidades"}, a ${p.nc} ${p.nc===1?"cliente":"clientes"}.`); }
  if(D.entrada.length&&D.nuevos.length){ const e=D.entrada[0]; add("good",`Los clientes nuevos suelen partir comprando ${e[0]} (${e[1]} de ${D.nuevos.length}). Úsalo como producto "gancho" en tus publicaciones para captar clientes.`); }
  const kc=D.canales.filter(c=>c.name!=="Sin canal"&&c.nuevos).sort((a,b)=>b.nuevos-a.nuevos)[0]; if(kc) add("good",`El canal que más clientes nuevos te trae es ${kc.name} (${kc.nuevos}).`);
  const ko=D.origenes.filter(([o])=>o!=="Sin dato"); if(ko.length) add("info",`La forma más común en que te conocen: ${ko[0][0]} (${ko[0][1]} ${ko[0][1]===1?"cliente":"clientes"}).${ko.some(([o])=>o==="Recomendación de un cliente")?" Las recomendaciones funcionan: un descuento por traer a un amigo puede multiplicarlas.":""}`);
  const nb=D.buyers.length; if(nb){ const r=D.repeat/nb; add(r>=0.4?"good":r>=0.2?"warn":"bad",`${Math.round(r*100)}% de los clientes del periodo te ha comprado más de una vez.${r<0.4?" Para retenerlos, escríbeles cuando les toque reponer (lista de abajo).":""}`); }
  const tc=toContact(D.M); if(tc.length) add("warn",`${tc.length} ${tc.length===1?"cliente debería":"clientes deberían"} estar por reponer. Un mensaje por WhatsApp suele ser la venta más fácil del mes.`);
  return out;
}

async function submitFill(){
  const btn=document.querySelector("#fillform [type=submit]"); if(btn) btn.disabled=true; let n=0, err=0;
  for(const row of document.querySelectorAll("#fillform [data-cid]")){ const c=S.clients.find(x=>x.id===row.dataset.cid); if(!c) continue;
    const co=row.querySelector("[data-k=comuna]").value, or=row.querySelector("[data-k=origen]").value;
    if((co&&co!==(c.comuna||""))||(or&&or!==(c.origen||""))){ const d=Object.assign({},c); delete d.id; if(co) d.comuna=co; if(or) d.origen=or; if(await save(S.db.collection("clients").doc(c.id),d)) n++; else err++; } }
  for(const row of document.querySelectorAll("#fillform [data-sid]")){ const s=S.sales.find(x=>x.id===row.dataset.sid); const ch=row.querySelector("[data-k=channel]").value; if(!s||!ch) continue;
    const d=Object.assign({},s); delete d.id; d.channel=ch; d.updatedAt=new Date().toISOString(); if(await save(S.db.collection("sales").doc(s.id),d)) n++; else err++; }
  toast(err? `Se guardaron ${n}; ${err} no se pudieron guardar.` : n? `Listo: ${n} ${n===1?"dato guardado":"datos guardados"}.` : "No cambiaste nada.");
  if(btn) btn.disabled=false; if(!err){ closeSheet(); render(); } if(n) scheduleSync();
}

  const rowsT = Number(q.discount)>0 ? [["Subtotal",money(q.subtotal)],["Descuento"+(discText(q)?" ("+discText(q)+")":""),"-"+money(q.discount)],["Neto",money(c.neto)],["IVA 19%",money(c.iva)]] : [["Neto",money(c.neto)],["IVA 19%",money(c.iva)]];

  doc.text("TOTAL",W-M-48,y+5.6,{align:"right"}); doc.text(money(q.total),cx[3],y+5.6,{align:"right"});
  y+=20; doc.setTextColor(...ink); doc.setFontSize(9.5);
  if(q.notes && !isSale){ doc.setFont("helvetica","bold"); doc.text("Condiciones",M,y); doc.setFont("helvetica","normal"); const t=doc.splitTextToSize(q.notes,W-2*M); doc.text(t,M,y+5); y+=7+t.length*4.6; }
  if(isSale && q.paid!==false){ doc.setFont("helvetica","bold"); doc.setTextColor(27,125,82); doc.text("Pagado. ¡Gracias por tu compra!",M,y); doc.setTextColor(...ink); y+=9; }
  if(b.bank && (!isSale || q.paid===false)){ doc.setFont("helvetica","bold"); doc.text("Datos de pago",M,y); doc.setFont("helvetica","normal"); const t=doc.splitTextToSize(b.bank,W-2*M); doc.text(t,M,y+5); y+=7+t.length*4.6; }
  doc.setTextColor(...mute); doc.setFontSize(8.5); doc.text(isSale? ((q.doc==="Boleta"||q.doc==="Factura")&&q.docNumber? `Esta nota de venta no es un documento tributario. La ${q.doc.toLowerCase()} electrónica N° ${q.docNumber} se emitió por separado.` : "Esta nota de venta no es un documento tributario. La boleta o factura se emite por separado.") : "Esta cotización no es un documento tributario. La boleta o factura se emite al concretar la compra.",M,262);
  return doc.output("blob");
}

function openExpenseSheet(x){
  const isNew=!x;
  x = x || {date:todayStr(), provider:"", detail:"", category:EXP_CATS[0], total:"", doc:"Factura", docNumber:"", iva:"", inCost:true, notes:""};
  sheetState={kind:"expense", id:x.id||null, createdAt:x.createdAt||null, ivaTouched:!isNew, costTouched:!isNew, confirm:false};
  const provs=[...new Set(S.expenses.map(e=>e.provider).filter(Boolean))];
  openSheet(`<div class="sh"><h2>${isNew?"Nuevo gasto":"Editar gasto"}</h2><button class="btn ghost" type="button" data-act="close">Cerrar</button></div>
  <form class="form" id="expform">
    <div class="grid2"><label class="f">Fecha<input type="date" id="x-date" value="${esc(x.date)}" required></label>
    <label class="f">Proveedor<input id="x-prov" list="provlist" value="${esc(x.provider)}" placeholder="Dónde compraste" autocomplete="off"></label></div>
    <datalist id="provlist">${provs.map(p=>`<option value="${esc(p)}">`).join("")}</datalist>
    <label class="f">Qué compraste<input id="x-detail" value="${esc(x.detail)}" placeholder="Ej: 20 litros de vinagre"></label>
    <label class="f">Tipo de gasto<select id="x-cat">${opt(EXP_CATS,x.category)}</select></label>
    ${(()=>{ const ls=peLines(); const cur=x.product||""; const al=x.alloc||{};
      return `<label class="f">¿Para qué producto?<select id="x-prod"><option value=""${cur===""?" selected":""}>Compartido (sirve para varios productos)</option>${ls.map(l=>`<option value="${esc(l.id)}"${cur===l.id?" selected":""}>${esc(l.name)}</option>`).join("")}<option value="varios"${cur==="varios"?" selected":""}>Repartir entre varios productos…</option></select></label>
      <div id="x-allocbox" class="panel" style="display:grid;gap:8px"${cur==="varios"?"":" hidden"}><p class="note" style="margin:0">Escribe cuánto (sin IVA) corresponde a cada producto. Lo que quede sin repartir se cuenta como compartido.</p>
      ${ls.map(l=>`<label class="f" style="grid-template-columns:1fr 130px;align-items:center;display:grid;gap:8px">${esc(l.name)}<input type="number" min="0" inputmode="numeric" data-alloc="${esc(l.id)}" value="${esc(al[l.id]??"")}" placeholder="0"></label>`).join("")}
      <p class="note" id="x-allocsum" style="margin:0"></p></div>`; })()}
    <div class="grid2"><label class="f">Total pagado (con IVA)<input id="x-total" type="number" min="0" inputmode="numeric" value="${esc(x.total)}" required></label>
    <label class="f">Documento<select id="x-doc">${opt(EXP_DOCS,x.doc)}</select></label></div>
    <div class="grid2" id="x-factrow"${x.doc==="Factura"?"":" hidden"}><label class="f">N° de factura<input id="x-docn" inputmode="numeric" value="${esc(x.docNumber||"")}"></label>
    <label class="f">IVA de la factura<input id="x-iva" type="number" min="0" inputmode="numeric" value="${esc(x.iva)}"></label></div>
    <p class="note" id="x-ivanote" style="margin:0"${x.doc==="Factura"?"":" hidden"}>El IVA se calcula solo (19% incluido en el total). Si la factura dice otro monto, escríbelo tal como aparece.</p>
    <label class="check"><input type="checkbox" id="x-incost" ${x.inCost?"checked":""}> Ya está incluido en el costo de mis productos</label>
    <label class="check"><input type="checkbox" id="x-acct" ${x.fromAccount===false?"":"checked"}> Lo pagué desde la cuenta del negocio</label>
    <label class="check"><input type="checkbox" id="x-adv" ${x.advance?"checked":""}> Es un abono para una compra futura (todavía no recibo el producto)</label>
    ${(()=>{ if(x.advance) return ""; const adv=S.expenses.filter(e=>e.advance && e.id!==x.id); if(!adv.length) return ""; return `<div class="panel" style="display:grid;gap:6px"><b style="font-size:14px">Abonos pendientes</b>${adv.map(e=>`<label class="check"><input type="checkbox" data-useadv="${esc(e.id)}"> Esta compra usa el abono de ${money(e.total)} a ${esc(e.provider||"proveedor")} (${fmtDate(e.date)})</label>`).join("")}<p class="note" style="margin:0">Marca el abono si esta compra es la que ya pagaste en parte. Escribe arriba el total de la factura: el abono se elimina para no restarlo dos veces del banco.</p></div>`; })()}
    <label class="f">Notas<textarea id="x-notes">${esc(x.notes||"")}</textarea></label>
    <div id="delzone"></div>
    <div class="acts">${isNew?"":`<button class="btn danger" type="button" data-act="askDel">Eliminar</button>`}<button class="btn primary" type="submit">${isNew?"Guardar gasto":"Guardar cambios"}</button></div>
  </form>`);  expFormUpdate("init");
}
function expFormUpdate(src){
  const g=id=>document.getElementById(id); if(!g("x-total")) return;
  if(src==="x-iva") sheetState.ivaTouched=true;
  if(src==="x-incost") sheetState.costTouched=true;
  if(src==="x-cat" && !sheetState.costTouched) g("x-incost").checked = IN_COST_CATS.includes(g("x-cat").value);
  if(g("x-prod")){ const v=g("x-prod").value; g("x-allocbox").hidden = v!=="varios";
    if(v==="varios"){ const t=Number(g("x-total").value)||0; const d=g("x-doc").value==="Factura"; const net = d? t-(Number(g("x-iva").value)||0) : t; let sum=0; document.querySelectorAll("[data-alloc]").forEach(i=>sum+=Number(i.value)||0); g("x-allocsum").textContent=`Repartido ${money(sum)} de ${money(net)} sin IVA${net-sum>0?` · quedan ${money(net-sum)} como compartido`:net-sum<0?" · ¡te pasaste!":""}`; } }
  const fact = g("x-doc").value==="Factura";
  g("x-factrow").hidden=!fact; g("x-ivanote").hidden=!fact;
  if(fact && !sheetState.ivaTouched){ const t=Number(g("x-total").value)||0; g("x-iva").value = t? t-Math.round(t/(1+IVA)) : ""; }
}
async function submitExpense(){
  const g=id=>document.getElementById(id);
  const total=Number(g("x-total").value)||0; if(total<=0){ toast("Escribe cuánto pagaste."); return; }
  const doc=g("x-doc").value;
  const data={date:g("x-date").value||todayStr(), provider:g("x-prov").value.trim(), detail:g("x-detail").value.trim(), category:g("x-cat").value, total, doc,
    docNumber: doc==="Factura"? g("x-docn").value.trim():"", iva: doc==="Factura"? (Number(g("x-iva").value)||0):0, inCost:g("x-incost").checked&&!g("x-adv").checked, fromAccount:g("x-acct").checked, advance:g("x-adv").checked, notes:g("x-notes").value.trim(),
    product: g("x-prod")? g("x-prod").value : "", alloc: (()=>{ if(!g("x-prod")||g("x-prod").value!=="varios") return {}; const o={}; document.querySelectorAll("[data-alloc]").forEach(i=>{ const v=Number(i.value)||0; if(v>0) o[i.dataset.alloc]=v; }); return o; })(),
    createdAt:sheetState.createdAt||new Date().toISOString(), updatedAt:new Date().toISOString()};
  if(!data.provider && !data.detail){ toast("Escribe el proveedor o qué compraste."); return; }
  const used=[...document.querySelectorAll("[data-useadv]:checked")].map(i=>S.expenses.find(e=>e.id===i.dataset.useadv)).filter(Boolean);
  if(used.length && !data.advance) data.notes=(data.notes?data.notes+" ":"")+used.map(e=>`Incluye abono de ${money(e.total)} pagado el ${fmtDate(e.date)}.`).join(" ");
  const isNew=!sheetState.id;
  const ref= sheetState.id? S.db.collection("expenses").doc(sheetState.id) : S.db.collection("expenses").doc();
  if(await save(ref,data,isNew?"Gasto guardado":"Cambios guardados")){
    if(!data.advance) for(const e of used){ try{ await S.db.collection("expenses").doc(e.id).delete(); }catch(_){ toast("No se pudo marcar el abono como usado."); } }
    if(isNew && ym(data.date)!==S.month) S.month=ym(data.date); closeSheet(); render(); scheduleSync(); }
}

function openClientSheet(c){
  const isNew=!c; c=c||{name:"",phone:"",notes:""};
  sheetState={kind:"client", id:c.id||null, createdAt:c.createdAt||null, confirm:false};
  const hist= c.id? S.sales.filter(s=>s.clientId===c.id).sort((a,b)=>(b.date||"").localeCompare(a.date||"")) : [];
  const t=sumUp(hist);
  openSheet(`<div class="sh"><h2>${isNew?"Nuevo cliente":esc(c.name)}</h2><button class="btn ghost" type="button" data-act="close">Cerrar</button></div>
  <form class="form" id="clientform">
    <label class="f">Nombre<input id="c-name" value="${esc(c.name)}" required></label>
    <label class="f">Teléfono / WhatsApp<input id="c-phone" inputmode="tel" value="${esc(c.phone||"")}" placeholder="+56 9 ..."></label>
    <div class="grid2"><label class="f">Comuna<select id="c-comuna">${optBlank(COMUNAS, c.comuna||"", "Elige comuna")}</select></label>
    <label class="f">¿Cómo nos conoció?<select id="c-origen">${optBlank(ORIGENES, c.origen||"", "Elige una opción")}</select></label></div>
    <label class="f">Notas<textarea id="c-notes" placeholder="Dirección, preferencias…">${esc(c.notes||"")}</textarea></label>
    <div id="delzone"></div>
    <div class="acts">${!isNew&&!hist.length?`<button class="btn danger" type="button" data-act="askDel">Eliminar</button>`:""}<button class="btn primary" type="submit">Guardar</button></div>
  </form>
  ${hist.length?`<h3>Historial · ${t.n} ${t.n===1?"compra":"compras"} · ${money(t.total)}</h3><div class="list">${hist.map(saleRow).join("")}</div>`:""}`);
}
async function submitClient(){
  const g=id=>document.getElementById(id); const name=g("c-name").value.trim(); if(!name){ toast("Escribe el nombre."); return; }
  const prev=sheetState.id? S.clients.find(x=>x.id===sheetState.id) : null;
  const data=Object.assign({}, prev||{}, {name, phone:g("c-phone").value.trim(), comuna:g("c-comuna").value, origen:g("c-origen").value, notes:g("c-notes").value.trim(), createdAt:sheetState.createdAt||new Date().toISOString()}); delete data.id;
  const ref= sheetState.id? S.db.collection("clients").doc(sheetState.id): S.db.collection("clients").doc();
  if(await save(ref,data,"Cliente guardado")){
    if(sheetState.id){ // keep sale names in sync
      const renamed=S.sales.filter(s=>s.clientId===sheetState.id && s.clientName!==name);
      for(const s of renamed){ const d=Object.assign({},s); delete d.id; d.clientName=name; await save(S.db.collection("sales").doc(s.id),d); }
      if(renamed.length) scheduleSync();
    }
    closeSheet(); render(); scheduleSync();
  }
}

/* ---------- events ---------- */
document.getElementById("tabs").addEventListener("click",e=>{ const b=e.target.closest("button[data-v]"); if(!b) return; S.view=b.dataset.v; if(S.view==="ventas") S.saleFilter="todas"; try{localStorage.setItem("karu.view",S.view);}catch(_){} render(); window.scrollTo(0,0); });
document.getElementById("month").addEventListener("change",e=>{ S.month=e.target.value; if(S.view==="ventas") S.saleFilter="todas"; render(); });
document.getElementById("fab").addEventListener("click",()=>{ if(S.view==="gastos") openExpenseSheet(); else if(S.view==="cotizaciones") openQuoteSheet(); else if(S.view==="clientes") openClientSheet(); else openSaleSheet(); });
document.getElementById("main").addEventListener("input",e=>{ if(e.target.id==="clientq"){ S.clientQ=e.target.value; const pos=e.target.selectionStart; render(); const i=document.getElementById("clientq"); if(i){ i.focus(); try{i.setSelectionRange(pos,pos);}catch(_){}} } });
document.addEventListener("click", async e=>{
  const b=e.target.closest("[data-act]"); if(!b) { if(e.target.id==="sheetbg") closeSheet(); return; }
  const a=b.dataset.act;
  if(a==="goto"){ S.view=b.dataset.to; if(b.dataset.filter) S.saleFilter=b.dataset.filter; render(); window.scrollTo(0,0); }
  else if(a==="filter"){ S.saleFilter=b.dataset.f; render(); }
  else if(a==="anP"){ S.anP=b.dataset.p; try{localStorage.setItem("karu.anP",S.anP);}catch(_){} render(); }
  else if(a==="fillData"){ openFillSheet(); }
  else if(a==="syncNow"){ syncSheet(); }
  else if(a==="discQuick"){ const v=Number(b.dataset.v); document.getElementById("d-val").value=v||""; document.getElementById("d-type").value="pct"; if(v===10 && !document.getElementById("d-label").value) document.getElementById("d-label").value="Código reseña"; if(!v) document.getElementById("d-label").value=""; readDiscount(); b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); totalsBox(); }
  else if(a==="editSale"){ const s=S.sales.find(x=>x.id===b.dataset.id); if(s) openSaleSheet(s); }
  else if(a==="setBalance"){ openBalanceSheet(); }
  else if(a==="finP"){ S.finP=b.dataset.p; try{localStorage.setItem("karu.finP",S.finP);}catch(_){} render(); }
  else if(a==="finT"){ S.finT=b.dataset.t; try{localStorage.setItem("karu.finT",S.finT);}catch(_){} render(); }
  else if(a==="finPdf"){ if(!S.dl||!window.jspdf){ toast("La descarga no está disponible aquí."); return; } try{ const blob=finPdf(); await S.dl.save({filename:"Karu-estados-financieros-"+todayStr()+".pdf", data:blob}); toast("PDF descargado"); }catch(err){ if(err&&err.code==="declined") return; toast("No se pudo descargar el PDF."); } }
  else if(a==="beMode"){ S.beMode=b.dataset.m; try{localStorage.setItem("karu.beMode",S.beMode);}catch(_){} render(); }
  else if(a==="stockMove"){ openMoveSheet(b.dataset.t, b.dataset.id); }
  else if(a==="editMove"){ const m=S.moves.find(x=>x.id===b.dataset.id); if(m) openMoveSheet(m.type, m.stockId, m); }
  else if(a==="editExp"){ const x=S.expenses.find(y=>y.id===b.dataset.id); if(x) openExpenseSheet(x); }
  else if(a==="editClient"){ const c=S.clients.find(x=>x.id===b.dataset.id); if(c) openClientSheet(c); }
  else if(a==="editQuote"){ const q=S.quotes.find(x=>x.id===b.dataset.id); if(q) openQuoteSheet(q); }
  else if(a==="close") closeSheet();
  else if(a==="addItem"){ readItems(); sheetState.items.push(newItem()); const wrap=document.getElementById("items").parentElement; const tmp=document.createElement("div"); tmp.innerHTML=itemsEditor(sheetState.items); document.querySelector(".itemhead").remove(); document.getElementById("items").remove(); document.querySelector('[data-act=addItem]').replaceWith(...tmp.childNodes); totalsBox(); }
  else if(a==="rmItem"){ readItems(); if(sheetState.items.length>1){ sheetState.items.splice(+b.dataset.i,1); const tmp=document.createElement("div"); tmp.innerHTML=itemsEditor(sheetState.items); document.querySelector(".itemhead").remove(); document.getElementById("items").remove(); document.querySelector('[data-act=addItem]').replaceWith(...tmp.childNodes); totalsBox(); } }
  else if(a==="askDel"){ document.getElementById("delzone").innerHTML=`<div class="confirm">¿Eliminar definitivamente? <button class="btn sm danger" type="button" data-act="doDel">Sí, eliminar</button><button class="btn sm" type="button" data-act="noDel">No</button></div>`; }
  else if(a==="noDel"){ document.getElementById("delzone").innerHTML=""; }
  else if(a==="doDel"){ const col={sale:"sales",quote:"quotes",client:"clients",expense:"expenses",move:"stockMoves"}[sheetState.kind]; try{ await S.db.collection(col).doc(sheetState.id).delete(); toast("Eliminado"); closeSheet(); render(); if(col==="sales"||col==="expenses") scheduleSync(); }catch(err){ toast("No se pudo eliminar. Intenta de nuevo."); } }
  else if(a==="quoteToSale"){ const q=S.quotes.find(x=>x.id===sheetState.id); if(q){ openSaleSheet(null,q); } }
  else if(a==="copyQuote"){ const q=Object.assign(quoteFromForm(),{}); const txt=quoteText(q); try{ await navigator.clipboard.writeText(txt); toast("Copiada. Pégala en WhatsApp."); }catch(_){ openSheet(`<div class="sh"><h2>Texto de la cotización</h2><button class="btn ghost" type="button" data-act="close">Cerrar</button></div><p class="muted">Mantén presionado para seleccionar y copiar.</p><textarea style="min-height:280px" id="qtxt">${esc(txt)}</textarea>`); } }
  else if(a==="pdfSale"){ pdfSale(); }
  else if(a==="pdfQuote"){ if(!S.dl||!window.jspdf){ toast("La descarga no está disponible aquí."); return; } const q=quoteFromForm(); try{ const blob=buildPdf(q); await S.dl.save({filename:`Cotizacion-${String(q.number).padStart(4,"0")}-${q.clientName.replace(/[^\w\- ]+/g,"").trim()||"cliente"}.pdf`, data:blob}); toast("PDF descargado"); }catch(err){ if(err&&err.code==="declined") return; toast(err&&err.code==="rate_limited"?"Espera un momento e intenta de nuevo.":"No se pudo descargar el PDF."); } }
  else if(a==="saveProd"){ const row=b.closest(".prodrow"); const p=S.products.find(x=>x.id===b.dataset.id); if(!p) return; const d=Object.assign({},p); delete d.id; d.name=row.querySelector("[data-k=name]").value.trim()||p.name; d.cost=Number(row.querySelector("[data-k=cost]").value)||0; d.price=Number(row.querySelector("[data-k=price]").value)||0; await save(S.db.collection("products").doc(p.id),d,"Producto guardado"); }
  else if(a==="toggleProd"){ const p=S.products.find(x=>x.id===b.dataset.id); if(!p) return; const d=Object.assign({},p); delete d.id; d.active = p.active===false; await save(S.db.collection("products").doc(p.id),d, d.active?"Vuelve a aparecer en ventas":"Ya no aparece en ventas"); }
  else if(a==="newProd"){ const ref=S.db.collection("products").doc(); await save(ref,{name:"Producto nuevo",cost:0,price:0,active:true,order:(Math.max(0,...S.products.map(p=>p.order||0))+1)},"Producto agregado. Cámbiale el nombre y los valores."); }
  else if(a==="csv"){ const rows=[["Fecha","Cliente","Comuna","Productos","Total cobrado","Neto","IVA","Costo","Ganancia","Canal","Medio de pago","Documento","N° documento","Pagado","Notas"]];
    [...S.sales].sort((x,y)=>(x.date||"").localeCompare(y.date||"")).forEach(s=>{ const c=calc(s); rows.push([s.date,s.clientName,saleComuna(s),itemsText(s.items),c.total,c.neto,c.iva,c.cost,c.gain,s.channel,s.payment,s.doc,s.docNumber||"",s.paid===false?"No":"Sí",s.notes||""]); });
    const csv="﻿"+rows.map(r=>r.map(v=>{ v=String(v==null?"":v); return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(",")).join("\n");
    try{ await S.dl.save({filename:"karu-esencial-ventas-"+todayStr()+".csv", data:csv}); toast("Respaldo descargado"); }catch(err){ if(err&&err.code!=="declined") toast("No se pudo descargar."); } }
});
document.addEventListener("input",e=>{ if(sheetState && /^d-/.test(e.target.id||"")){ readDiscount(); totalsBox(); } else if(sheetState && e.target.closest("#items")){ readItems(); totalsBox(); } else if(sheetState && sheetState.kind==="expense" && e.target.closest("#expform")) expFormUpdate(e.target.id); });
document.addEventListener("change",e=>{ if(sheetState && /^d-/.test(e.target.id||"")){ readDiscount(); totalsBox(); } else if(sheetState && e.target.closest("#items")){ readItems(); totalsBox(); } else if(sheetState && sheetState.kind==="expense" && e.target.closest("#expform")) expFormUpdate(e.target.id); });
document.addEventListener("submit", async e=>{
  e.preventDefault();
  if(e.target.id==="saleform") submitSale();
  else if(e.target.id==="quoteform") submitQuote();
  else if(e.target.id==="clientform") submitClient();
  else if(e.target.id==="expform") submitExpense();
  else if(e.target.id==="moveform") submitMove();
  else if(e.target.id==="balform") submitBalance();
  else if(e.target.id==="fillform") submitFill();
  else if(e.target.id==="bizform"){ const g=id=>document.getElementById(id).value.trim(); await save(S.db.doc("settings/business"),{name:g("b-name"),rut:g("b-rut"),giro:g("b-giro"),address:g("b-addr"),phone:g("b-phone"),email:g("b-email"),web:g("b-web"),bank:g("b-bank")},"Datos guardados"); }
});
// Al elegir un cliente que ya existe, completa su comuna, cómo nos conoció y teléfono
document.addEventListener("input",e=>{ if(e.target.id!=="s-client") return; const c=S.clients.find(x=>norm(x.name)===norm(e.target.value)); if(!c) return; const g=id=>document.getElementById(id);
  if(c.comuna&&g("s-comuna")) g("s-comuna").value=c.comuna; if(c.origen&&g("s-origen")) g("s-origen").value=c.origen; if(c.phone&&g("s-phone")&&!g("s-phone").value) g("s-phone").value=c.phone; });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && sheetState) closeSheet(); });

render();
boot();
})();
</script>
